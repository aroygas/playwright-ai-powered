name: Setup
description: Node + npm cache + Playwright browsers cache (keyed by the pinned Playwright version)
inputs:
  browsers:
    description: Space-separated browsers to install; empty installs none (no cache, no install steps)
    default: chromium
  node-version:
    description: Node version; empty = the one in .nvmrc
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: npm
    - run: npm ci
      shell: bash
    - id: pw
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: cache
      if: inputs.browsers != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}
    - if: inputs.browsers != '' && steps.cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
    - if: inputs.browsers != '' && steps.cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ inputs.browsers }}
      shell: bash
