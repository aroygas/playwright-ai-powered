name: Nightly regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_env:
        description: Target environment
        type: choice
        options: [local, dev, staging, prod]
        default: local
      include_quarantine:
        description: Also run @quarantine tests (reported, never blocking)
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write # publish Allure report to gh-pages

env:
  CI: true
  TEST_ENV: ${{ inputs.test_env || vars.TEST_ENV || 'local' }}
  ADMIN_UI_USERNAME: ${{ secrets.ADMIN_UI_USERNAME }}
  ADMIN_UI_PASSWORD: ${{ secrets.ADMIN_UI_PASSWORD }}
  ADMIN_API_USERNAME: ${{ secrets.ADMIN_API_USERNAME }}
  ADMIN_API_PASSWORD: ${{ secrets.ADMIN_API_PASSWORD }}
  USER_UI_USERNAME: ${{ secrets.USER_UI_USERNAME }}
  USER_UI_PASSWORD: ${{ secrets.USER_UI_PASSWORD }}
  USER_API_USERNAME: ${{ secrets.USER_API_USERNAME }}
  USER_API_PASSWORD: ${{ secrets.USER_API_PASSWORD }}
  WORKER_ACCOUNTS: ${{ secrets.WORKER_ACCOUNTS }}

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}.zip
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        # mobile-chrome is Chromium with a Pixel 7 profile
        with:
          { browsers: "${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}" }
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Name shard artifact
        if: always()
        id: shard
        run: echo "name=${{ matrix.project }}-$(echo '${{ matrix.shard }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ steps.shard.outputs.name }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  api-ct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:api
        env: { PLAYWRIGHT_BLOB_OUTPUT_NAME: report-api.zip }
      - run: npm run test:ct
        env: { PLAYWRIGHT_BLOB_OUTPUT_NAME: report-ct.zip }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-api-ct
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  quarantine:
    if: inputs.include_quarantine == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # informational: quarantined tests never block
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:quarantine

  report:
    needs: [regression, api-ct]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browsers: '' }
      - uses: ./.github/actions/report
      # Publish the Allure report (with history + trends) to GitHub Pages from the gh-pages branch.
      - name: Get published Allure reports
        uses: actions/checkout@v4
        if: always() && hashFiles('allure-results/**') != ''
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Build Allure site with history
        uses: yuvalgabay/allure-v3-report-action@v1
        if: always() && hashFiles('allure-results/**') != ''
        with:
          allure_results: allure-results
          allure_report: allure-site-report
          allure_history: allure-site
          gh_pages: gh-pages
          report_name: Playwright AI-powered
          keep_reports: 20
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && hashFiles('allure-results/**') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-site
