# Reduced GitLab variant of .github/workflows/{pr,nightly}.yml: no flaky gate, no quarantine job and no
# nightly sharding (see docs/CI.md). Secrets: set the same names as masked CI/CD variables.
# Image tag MUST match the pinned @playwright/test version (docs/DESIGN.md, Playwright version lock).
default:
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

stages: [static, test, report]

variables:
  CI: 'true'
  TEST_ENV: local # override in pipeline schedules / manual runs

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

static:
  stage: static
  script:
    - npm run lint
    - npm run typecheck
    - npm run format:check
    - npm run test:list

component:
  stage: test
  variables: { PLAYWRIGHT_BLOB_OUTPUT_NAME: report-ct.zip }
  script: npm run test:ct
  artifacts:
    when: always
    expire_in: 1 week
    paths: [blob-report/]

api:
  stage: test
  variables: { PLAYWRIGHT_BLOB_OUTPUT_NAME: report-api.zip }
  script: npm run test:api
  artifacts:
    when: always
    expire_in: 1 week
    paths: [blob-report/]

e2e-smoke:
  stage: test
  parallel: 4
  script:
    - npx playwright test --project=chromium --grep @smoke --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  # Sharded blobs get a per-shard suffix, so they merge without overwriting each other.
  artifacts:
    when: always
    expire_in: 1 week
    paths: [blob-report/]

nightly-regression:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables: { PLAYWRIGHT_BLOB_OUTPUT_NAME: report-$PROJECT.zip }
  parallel:
    matrix:
      - PROJECT: [chromium, firefox, webkit, mobile-chrome]
  script:
    - npx playwright test --project=$PROJECT
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [blob-report/]

report:
  stage: report
  when: always
  needs:
    - job: component
      artifacts: true
      optional: true
    - job: api
      artifacts: true
      optional: true
    - job: e2e-smoke
      artifacts: true
      optional: true
    - job: nightly-regression
      artifacts: true
      optional: true
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key: allure-history # history across runs
      paths: [allure-history/]
  script:
    # allure-playwright 3.14 throws in onConfigure under merge-reports (no projects yet), so the merge
    # exits 1 even when all tests passed; the reports are still written. Fail only if none were.
    - npm run report:merge || [ -f merged-report/results.json ]
    - mkdir -p allure-history
    - npm run report:allure
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [playwright-report/, merged-report/, allure-report/, allure-history/]
